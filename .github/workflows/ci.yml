name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sdk-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WireSockUI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify pinned direct SDK contract
        shell: pwsh
        run: ./scripts/Verify-WgboosterContract.ps1 -SdkRoot ./sdk-contract

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WireSockUI.sln /p:Platform=${{ matrix.platform }} --locked-mode -m:1

      - name: Verify formatting
        run: dotnet format WireSockUI.sln whitespace --verify-no-changes --no-restore

      - name: Run focused tests
        run: >
          dotnet run --project WireSockUI.Tests/WireSockUI.Tests.csproj
          --configuration Release
          --framework net472-windows
          --no-restore
          /p:Platform=${{ matrix.platform }}
          /p:UseSharedCompilation=false

  sdk-integration:
    # Never execute pull-request code on the elevated SDK runners. Pull requests use
    # the pinned contract tests above; real driver validation runs after merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - sdk-contract
      - test
    uses: ./.github/workflows/sdk-integration.yml

  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    needs:
      - sdk-contract
      - test
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release
          - Release UWP
        platform:
          - AnyCPU
          - ARM64
          - x86
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Publish WireSockUI
        run: >
          dotnet publish WireSockUI/WireSockUI.csproj
          --configuration "${{ matrix.configuration }}"
          --framework net472-windows
          --no-self-contained
          /p:Platform="${{ matrix.platform }}"
          /p:UseSharedCompilation=false
          /p:Version=0.0.0
          /p:Repository="${{ github.repository }}"
          /p:RestoreLockedMode=true
          -m:1
