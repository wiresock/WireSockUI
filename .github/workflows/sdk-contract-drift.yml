name: WireSock SDK Contract Drift

on:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      trusted_sha: ${{ steps.authorize.outputs.trusted_sha }}
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize protected default-branch revision
        id: authorize
        shell: pwsh
        env:
          DEFAULT_BRANCH: main
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'wiresock/WireSockUI') {
            throw "SDK drift validation may run only for wiresock/WireSockUI, not '$env:GITHUB_REPOSITORY'."
          }
          $expectedRef = "refs/heads/$env:DEFAULT_BRANCH"
          if ($env:WORKFLOW_REF -cne $expectedRef) {
            throw "SDK drift checks may run only from $expectedRef, not '$env:WORKFLOW_REF'."
          }

          git fetch --no-tags origin "+refs/heads/${env:DEFAULT_BRANCH}:refs/remotes/origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch the protected branch '$env:DEFAULT_BRANCH'."
          }

          $trustedSha = (git rev-parse 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $trustedSha -notmatch '\A[0-9a-f]{40}\z') {
            throw 'Unable to resolve the checked-out workflow revision.'
          }

          $defaultBranchSha = (
            git rev-parse "refs/remotes/origin/$env:DEFAULT_BRANCH"
          ).Trim()
          if ($LASTEXITCODE -ne 0 -or
              $defaultBranchSha -notmatch '\A[0-9a-f]{40}\z' -or
              $trustedSha -cne $defaultBranchSha) {
            throw "SDK drift validation refuses stale revision $trustedSha; the current protected tip is $defaultBranchSha."
          }

          "trusted_sha=$trustedSha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  compare-upstream:
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 10
    environment: wiresock-sdk-contract
    steps:
      - name: Checkout WireSockUI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.authorize.outputs.trusted_sha }}
          path: wiresockui
          persist-credentials: false

      - name: Create short-lived SDK read token
        id: sdk-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WIRESOCK_SDK_READER_CLIENT_ID }}
          private-key: ${{ secrets.WIRESOCK_SDK_READER_PRIVATE_KEY }}
          owner: Wiresock-Foundation
          repositories: wiresock-vpn-client
          permission-contents: read

      # The SDK default branch contains unreleased contract changes.
      # Measure drift against the highest release/vMAJOR.MINOR.PATCH branch.
      - name: Resolve latest WireSock SDK release branch
        id: sdk-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.sdk-token.outputs.token }}
          SDK_REPOSITORY: Wiresock-Foundation/wiresock-vpn-client
          SDK_API_URL: ${{ github.api_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./wiresockui/scripts/Resolve-SdkReleaseBranch.ps1 `
            -Repository $env:SDK_REPOSITORY `
            -GitHubApiUrl $env:SDK_API_URL `
            -OutputPath $env:GITHUB_OUTPUT

      - name: Checkout latest WireSock SDK release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Wiresock-Foundation/wiresock-vpn-client
          ref: ${{ steps.sdk-release.outputs.release_branch }}
          path: wiresock-sdk
          token: ${{ steps.sdk-token.outputs.token }}
          persist-credentials: false

      - name: Verify current upstream contract
        shell: pwsh
        run: ./wiresockui/scripts/Verify-WgboosterContract.ps1 -SdkRoot ./wiresock-sdk

      - name: Detect upstream SDK contract drift
        shell: pwsh
        env:
          SDK_RELEASE_BRANCH: ${{ steps.sdk-release.outputs.release_branch }}
          SDK_RELEASE_SHA: ${{ steps.sdk-release.outputs.release_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseBranch = [string]$env:SDK_RELEASE_BRANCH
          $releaseSha = [string]$env:SDK_RELEASE_SHA
          if ($releaseBranch -cnotmatch '\Arelease/v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\z' -or
              $releaseSha -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'The resolved WireSock SDK release branch or commit is not canonical.'
          }

          $upstreamRevision = (git -C ./wiresock-sdk rev-parse 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $upstreamRevision -cne $releaseSha) {
            throw "Checked out WireSock SDK revision '$upstreamRevision' is not $releaseBranch at $releaseSha."
          }

          Write-Output "Comparing the pinned contract with WireSock SDK $releaseBranch ($releaseSha)."
          $pinnedRevision = (Get-Content ./wiresockui/sdk-contract/SDK_REVISION)[1].Trim()
          if ($pinnedRevision -cne $upstreamRevision) {
            Write-Warning "WireSock SDK release $releaseBranch moved from pinned revision $pinnedRevision to $upstreamRevision."
          }

          git diff --no-index --ignore-all-space --exit-code `
            ./wiresockui/sdk-contract/include/wgbooster.h `
            ./wiresock-sdk/include/wgbooster.h
          if ($LASTEXITCODE -ne 0) {
            throw 'The upstream wgbooster.h differs from the pinned contract. Review and update sdk-contract explicitly.'
          }

          git diff --no-index --ignore-all-space --exit-code `
            ./wiresockui/sdk-contract/wgbooster/wgbooster.def `
            ./wiresock-sdk/wgbooster/wgbooster.def
          if ($LASTEXITCODE -ne 0) {
            throw 'The upstream wgbooster.def differs from the pinned contract. Review and update sdk-contract explicitly.'
          }
